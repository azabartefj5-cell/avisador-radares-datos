# Actualiza la base de radares dos veces por semana y la publica en datos/.
# Los móviles consultan datos/version.json una vez al día y bajan la base si ha cambiado.
#
# - Listas oficiales: DGT y Servei Català de Trànsit (si no responden, se usa la última copia).
# - Mapa: el fichero de OpenStreetMap de España de Geofabrik (se renueva cada día).
# - Si la base nueva parece rota, publicar.py la rechaza y los móviles siguen con la anterior.
# - Si algo falla, GitHub avisa por correo al dueño del repositorio.
# - Cada ejecución hace un commit (al menos la fecha de comprobación), así GitHub no
#   desactiva la tarea programada por inactividad (lo hace a los 60 días sin actividad).
name: Actualizar radares

on:
  schedule:
    - cron: "17 3 * * 1,4"   # lunes y jueves a las 03:17 UTC
  workflow_dispatch:          # botón "Run workflow" para lanzarla a mano

permissions:
  contents: write

concurrency:
  group: actualizar-radares
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet "osmium>=4.0"

      - name: Descargar el mapa de España (OpenStreetMap, Geofabrik)
        run: |
          mkdir -p build
          curl -fsSL --retry 5 --retry-delay 60 -o build/spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          # Solo carreteras, radares e hitos: el fichero baja de ~1,5 GB a unos cientos de MB.
          osmium tags-filter build/spain.osm.pbf w/highway n/highway=speed_camera,milestone -o build/carreteras.osm.pbf --overwrite
          ls -lh build

      - name: Generar la base
        run: python -I herramientas/generar_radares.py --pbf build/carreteras.osm.pbf --salida build/radares.json

      - name: Comprobar y publicar
        run: python -I herramientas/publicar.py --entrada build/radares.json --destino datos

      - name: Guardar en el repositorio
        if: always()   # aunque falle la publicación, se guardan las copias de las listas oficiales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A herramientas/cache datos
          if git diff --cached --quiet; then
            echo "Nada que guardar"
          else
            git commit -m "Radares $(date -u +%F)"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
